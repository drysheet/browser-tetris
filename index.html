<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Tetris</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-shell">
        <div class="board-panel">
          <canvas
            id="game-board"
            width="300"
            height="600"
            aria-label="Tetris game board"
          >
            Tetris game board. Use the controls panel and arrow keys to play.
          </canvas>
          <div class="overlay hidden" id="message-overlay" aria-live="polite">
            <h1 id="overlay-title">Tetris</h1>
            <p id="overlay-text">Press Start to play.</p>
          </div>
        </div>

        <aside class="sidebar">
          <div class="panel">
            <h2>Status</h2>
            <div class="stat-row">
              <span>Score</span>
              <strong id="score">0</strong>
            </div>
            <div class="stat-row">
              <span>Level</span>
              <strong id="level">1</strong>
            </div>
            <div class="stat-row">
              <span>Lines</span>
              <strong id="lines">0</strong>
            </div>
          </div>

          <div class="panel">
            <h2>Next</h2>
            <canvas
              id="next-piece"
              width="120"
              height="120"
              aria-label="Next Tetris piece preview"
            >
              Preview of the next Tetris piece.
            </canvas>
          </div>

          <div class="panel controls">
            <button id="start-pause-button" type="button">Start</button>
            <button id="restart-button" type="button">Restart</button>
          </div>

          <div class="panel">
            <h2>Controls</h2>
            <ul>
              <li>← → Move</li>
              <li>↑ / Space Rotate</li>
              <li>↓ Soft drop</li>
            </ul>
          </div>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
